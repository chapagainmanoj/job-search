<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATS Job Hunter v2</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&family=Syne:wght@400;700;800&display=swap');

        :root {
            --bg: #080b10;
            --panel: #0e1117;
            --panel2: #131820;
            --border: #1c2235;
            --border2: #242d42;
            --green: #00e5a0;
            --blue: #3b9eff;
            --orange: #ff7b3a;
            --purple: #a855f7;
            --yellow: #f5c842;
            --pink: #f472b6;
            --red: #f87171;
            --teal: #2dd4bf;
            --text: #c5cedf;
            --muted: #44536b;
            --muted2: #637085;
            --sidebar-w: 210px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── TOP BAR ── */
        .topbar {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
            background: var(--panel);
            flex-shrink: 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 1.05rem;
            background: linear-gradient(90deg, var(--green), var(--blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            white-space: nowrap;
        }

        .topbar-meta {
            font-size: 0.6rem;
            color: var(--muted);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .topbar-right {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .pill {
            font-size: 0.58rem;
            padding: 3px 9px;
            border-radius: 20px;
            background: rgba(0, 229, 160, 0.08);
            border: 1px solid rgba(0, 229, 160, 0.2);
            color: var(--green);
            letter-spacing: 0.07em;
            text-transform: uppercase;
            white-space: nowrap;
        }

        /* ── LAYOUT ── */
        .layout {
            display: flex;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        /* ── SIDEBAR ── */
        .sidebar {
            width: var(--sidebar-w);
            flex-shrink: 0;
            border-right: 1px solid var(--border);
            background: var(--panel);
            overflow-y: auto;
            padding: 12px 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .sidebar-section {
            font-size: 0.55rem;
            color: var(--muted);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            padding: 10px 8px 4px;
            border-top: 1px solid var(--border);
            margin-top: 4px;
        }

        .sidebar-section:first-child {
            border-top: none;
            margin-top: 0;
        }

        .loc-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 10px;
            border-radius: 5px;
            border: 1px solid transparent;
            background: none;
            color: var(--muted2);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.68rem;
            cursor: pointer;
            text-align: left;
            width: 100%;
            transition: all 0.15s;
        }

        .loc-btn:hover {
            color: var(--text);
            background: rgba(255, 255, 255, 0.04);
        }

        .loc-btn.active {
            color: var(--text);
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--border2);
        }

        .loc-btn .flag {
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .loc-btn .loc-name {
            flex: 1;
        }

        .loc-btn .count {
            font-size: 0.55rem;
            background: var(--border2);
            color: var(--muted2);
            padding: 1px 5px;
            border-radius: 3px;
            flex-shrink: 0;
        }

        .loc-btn.active .count {
            background: rgba(0, 229, 160, 0.15);
            color: var(--green);
        }

        /* ── MAIN CONTENT ── */
        .main {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .loc-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border);
        }

        .loc-flag {
            font-size: 1.8rem;
        }

        .loc-title {
            font-family: 'Syne', sans-serif;
            font-size: 1.3rem;
            font-weight: 800;
        }

        .loc-desc {
            font-size: 0.65rem;
            color: var(--muted2);
            margin-top: 2px;
        }

        .ats-count-badge {
            margin-left: auto;
            font-size: 0.6rem;
            padding: 4px 10px;
            border-radius: 4px;
            background: var(--panel2);
            border: 1px solid var(--border);
            color: var(--muted2);
        }

        /* Open All button */
        .open-all-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }

        .btn-open-all {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.62rem;
            font-weight: 700;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            padding: 7px 14px;
            border-radius: 5px;
            border: 1px solid var(--green);
            background: rgba(0, 229, 160, 0.07);
            color: var(--green);
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn-open-all:hover {
            background: rgba(0, 229, 160, 0.15);
        }

        .btn-open-direct {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.62rem;
            font-weight: 700;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            padding: 7px 14px;
            border-radius: 5px;
            border: 1px solid var(--border2);
            background: var(--panel2);
            color: var(--muted2);
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn-open-direct:hover {
            color: var(--text);
            border-color: var(--blue);
            color: var(--blue);
        }

        /* ── ATS CARDS ── */
        .cards-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .ats-card {
            background: var(--panel2);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            transition: border-color 0.15s;
        }

        .ats-card:hover {
            border-color: var(--border2);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.01);
        }

        .ats-badge {
            font-size: 0.58rem;
            font-weight: 700;
            letter-spacing: 0.09em;
            text-transform: uppercase;
            padding: 3px 8px;
            border-radius: 3px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .b-ashby {
            background: rgba(0, 229, 160, 0.1);
            color: var(--green);
            border: 1px solid rgba(0, 229, 160, 0.25);
        }

        .b-lever {
            background: rgba(59, 158, 255, 0.1);
            color: var(--blue);
            border: 1px solid rgba(59, 158, 255, 0.25);
        }

        .b-gh {
            background: rgba(255, 123, 58, 0.1);
            color: var(--orange);
            border: 1px solid rgba(255, 123, 58, 0.25);
        }

        .b-workable {
            background: rgba(168, 85, 247, 0.1);
            color: var(--purple);
            border: 1px solid rgba(168, 85, 247, 0.25);
        }

        .b-recruitee {
            background: rgba(244, 114, 182, 0.1);
            color: var(--pink);
            border: 1px solid rgba(244, 114, 182, 0.25);
        }

        .b-smart {
            background: rgba(245, 200, 66, 0.1);
            color: var(--yellow);
            border: 1px solid rgba(245, 200, 66, 0.25);
        }

        .b-tailor {
            background: rgba(45, 212, 191, 0.1);
            color: var(--teal);
            border: 1px solid rgba(45, 212, 191, 0.25);
        }

        .b-personio {
            background: rgba(248, 113, 113, 0.1);
            color: var(--red);
            border: 1px solid rgba(248, 113, 113, 0.25);
        }

        .b-pageup {
            background: rgba(59, 158, 255, 0.1);
            color: var(--blue);
            border: 1px solid rgba(59, 158, 255, 0.25);
        }

        .b-workday {
            background: rgba(168, 85, 247, 0.1);
            color: var(--purple);
            border: 1px solid rgba(168, 85, 247, 0.25);
        }

        .b-breezy {
            background: rgba(0, 229, 160, 0.1);
            color: var(--green);
            border: 1px solid rgba(0, 229, 160, 0.25);
        }

        .b-pinpoint {
            background: rgba(245, 200, 66, 0.1);
            color: var(--yellow);
            border: 1px solid rgba(245, 200, 66, 0.25);
        }

        .b-zoho {
            background: rgba(45, 212, 191, 0.1);
            color: var(--teal);
            border: 1px solid rgba(45, 212, 191, 0.25);
        }

        .b-taleo {
            background: rgba(255, 123, 58, 0.1);
            color: var(--orange);
            border: 1px solid rgba(255, 123, 58, 0.25);
        }

        .card-ats-name {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--text);
        }

        .card-ats-url {
            font-size: 0.6rem;
            color: var(--muted);
            margin-left: auto;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 200px;
        }

        .card-direct-link {
            font-size: 0.6rem;
            color: var(--muted);
            text-decoration: none;
            margin-left: auto;
            padding: 2px 6px;
            border-radius: 3px;
            border: 1px solid var(--border);
            transition: all 0.12s;
            white-space: nowrap;
        }

        .card-direct-link:hover {
            color: var(--blue);
            border-color: var(--blue);
        }

        /* Queries inside card */
        .queries {
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .q-row {
            display: flex;
            align-items: stretch;
            gap: 8px;
            padding: 8px 10px;
            border-radius: 5px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid transparent;
            transition: all 0.13s;
        }

        .q-row:hover {
            border-color: var(--border);
            background: rgba(255, 255, 255, 0.02);
        }

        .q-text {
            flex: 1;
            font-size: 0.62rem;
            color: #5a6a88;
            line-height: 1.55;
            word-break: break-all;
            font-family: 'JetBrains Mono', monospace;
        }

        .q-text .t-site {
            color: var(--blue);
        }

        .q-text .t-kw {
            color: var(--green);
        }

        .q-text .t-neg {
            color: var(--red);
            opacity: 0.8;
        }

        .q-text .t-or {
            color: var(--yellow);
        }

        .q-text .t-loc {
            color: var(--teal);
        }

        .q-actions {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex-shrink: 0;
        }

        .btn-go {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.58rem;
            font-weight: 700;
            padding: 5px 10px;
            border-radius: 3px;
            border: none;
            cursor: pointer;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            white-space: nowrap;
            background: var(--green);
            color: #000;
            transition: all 0.13s;
        }

        .btn-go:hover {
            filter: brightness(1.15);
        }

        .btn-cp {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.58rem;
            padding: 4px 10px;
            border-radius: 3px;
            border: 1px solid var(--border2);
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            white-space: nowrap;
            transition: all 0.13s;
        }

        .btn-cp:hover {
            color: var(--text);
            border-color: var(--muted);
        }

        .btn-cp.ok {
            color: var(--green);
            border-color: rgba(0, 229, 160, 0.4);
        }

        /* ── MOBILE ── */
        @media (max-width: 700px) {
            .layout {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--border);
                overflow-x: auto;
                flex-direction: row;
                flex-wrap: nowrap;
                padding: 8px;
                gap: 4px;
            }

            .sidebar-section {
                display: none;
            }

            .loc-btn {
                white-space: nowrap;
                flex-shrink: 0;
                width: auto;
            }

            .loc-btn .count {
                display: none;
            }

            .main {
                padding: 12px;
            }
        }
    </style>
</head>

<body>

    </div>

    <div class="layout">
        <!-- SIDEBAR -->
        <nav class="sidebar" id="sidebar">

            <button class="loc-btn" onclick="setLoc('ae', this)">

                    id="cnt-us">5</span>

        </nav>

        <!-- MAIN -->
        <main class="main" id="main">
            <!-- Rendered by JS -->
        </main>
    </div>

        // ── RENDER ─────────────────────────────────────────────
        function renderSyntax(q) {
            return q
                .replace(/(site:[^\s]+)/g, '<span class="t-site">$1</span>')
                .replace(/("worldwide"|"anywhere"|"global remote"|"global"|"new zealand"|"hong kong"|"abu dhabi"|"US only"|"USA only"|"United States only"|"remote australia"|"visa sponsorship"|"sponsorship required"|"requires sponsorship"|"united states")/gi, '<span class="t-or">$1</span>')
                .replace(/(\((?:[^)]+)\))/g, s => '<span class="t-or">' + s + '</span>')
                .replace(/(-intern|-junior|-jobgether|-US\b|-USA\b|-Canada\b|-"[^"]+")/g, '<span class="t-neg">$1</span>')
                .replace(/\b(software|python|remote)\b/g, '<span class="t-kw">$1</span>')
                .replace(/\b(australia|new zealand|auckland|sydney|melbourne|brisbane|wellington|netherlands|amsterdam|rotterdam|eindhoven|germany|berlin|munich|hamburg|spain|madrid|barcelona|portugal|lisbon|porto|singapore|india|bangalore|hyderabad|mumbai|pune|japan|korea|taiwan|tokyo|seoul|UAE|dubai|europe)\b/gi, '<span class="t-loc">$1</span>');
        }

        function buildCard(cardData) {
            const a = ATS[cardData.ats];
            const q = cardData.q;
            const syntax = renderSyntax(q);
            return `
    <div class="ats-card">
      <div class="card-header">
        <span class="ats-badge ${a.badge}">${a.name}</span>
        <span class="card-ats-name"></span>
        <a class="card-direct-link" href="${a.href}" target="_blank" rel="noopener">↗ ${a.url}</a>
      </div>
      <div class="queries">
        <div class="q-row">
          <div class="q-text">${syntax}</div>
          <div class="q-actions">
            <button class="btn-go" onclick="openGoogle(${JSON.stringify(q)})">Search ↗</button>
            <button class="btn-cp" onclick="copyQ(this, ${JSON.stringify(q)})">Copy</button>
          </div>
        </div>
      </div>
    </div>`;
        }

        function render(locId) {
            const loc = LOCS[locId];
            const main = document.getElementById('main');
            const cards = loc.cards;

            const directLinks = [...new Set(cards.map(c => c.ats))].map(atsId => {
                const a = ATS[atsId];
                return `<a href="${a.href}" target="_blank" rel="noopener" style="color:var(--blue);font-size:0.62rem;text-decoration:none;padding:3px 7px;border:1px solid var(--border2);border-radius:3px;white-space:nowrap;transition:all .13s" onmouseover="this.style.borderColor='var(--blue)'" onmouseout="this.style.borderColor='var(--border2)'">${a.name}</a>`
            }).join('');

            main.innerHTML = `
    <div class="loc-header">
      <span class="loc-flag">${loc.flag}</span>
      <div>
        <div class="loc-title">${loc.title}</div>
        <div class="loc-desc">${loc.desc}</div>
      </div>
      <span class="ats-count-badge">${cards.length} queries</span>
    </div>
    <div class="open-all-bar">
      <button class="btn-open-all" onclick="openAllSearches('${locId}')">⬡ Run All ${cards.length} Searches</button>
      <button class="btn-open-direct" onclick="openAllDirect('${locId}')">↗ Open All Job Boards</button>
    </div>
    <div class="cards-grid">
      ${cards.map(buildCard).join('')}
    </div>`;

            // Update counts
            document.querySelectorAll('[id^="cnt-"]').forEach(el => {
                const id = el.id.replace('cnt-', '');
                if (LOCS[id]) el.textContent = LOCS[id].cards.length;
            });
        }

        // ── INTERACTIONS ──────────────────────────────────────
        let currentLoc = 'global';

        function setLoc(locId, btn) {
            document.querySelectorAll('.loc-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentLoc = locId;
            render(locId);
            document.getElementById('main').scrollTop = 0;
        }

        function openGoogle(q) {
            window.open('https://www.google.com/search?q=' + encodeURIComponent(q), '_blank');
        }

        function copyQ(btn, q) {
            navigator.clipboard.writeText(q).then(() => {
                btn.textContent = 'Copied!';
                btn.classList.add('ok');
                setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('ok'); }, 2000);
            });
        }

        function openAllSearches(locId) {
            LOCS[locId].cards.forEach((c, i) =>
                setTimeout(() => openGoogle(c.q), i * 200)
            );
        }

        function openAllDirect(locId) {
            const ids = [...new Set(LOCS[locId].cards.map(c => c.ats))];
            ids.forEach((id, i) =>
                setTimeout(() => window.open(ATS[id].href, '_blank'), i * 180)
            );
        }

        // ── INIT ──────────────────────────────────────────────
        render('global');
    </script>
